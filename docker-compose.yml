services:
  db:
    image: postgis/postgis:17-3.5
    container_name: karhutla-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: karhutla
      POSTGRES_PASSWORD: karhutla
      POSTGRES_DB: karhutla
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karhutla -d karhutla"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: